name: bugfix_04_chunker
description: |
  chunk() in chunker.py drops the final partial chunk, and returns an empty
  list when the input is shorter than the chunk size. The tests in tests/
  define the expected behavior. Fix it.
agent:
  command: 'python -m shakedown.demo_agent.agent --task {task_file} --workdir {workdir}'
  timeout_s: 240
  max_model_calls: 18
workspace:
  source: repo
  isolation: tempdir
success:
  command: 'python -m pytest -q tests/'
  timeout_s: 120
  pass_if: exit_code_0
prompt_chunks:
  - {id: identity, file: shakedown/demo_agent/prompt_chunks/identity.md, kind: system}
  - {id: workflow, file: shakedown/demo_agent/prompt_chunks/workflow.md, kind: system}
  - {id: verification, file: shakedown/demo_agent/prompt_chunks/verification.md, kind: system}
  - {id: tool_read_file, file: shakedown/demo_agent/prompt_chunks/tool_read_file.md, kind: tool_description, tool: read_file}
  - {id: tool_write_file, file: shakedown/demo_agent/prompt_chunks/tool_write_file.md, kind: tool_description, tool: write_file}
  - {id: tool_run_tests, file: shakedown/demo_agent/prompt_chunks/tool_run_tests.md, kind: tool_description, tool: run_tests}
  - {id: tool_list_dir, file: shakedown/demo_agent/prompt_chunks/tool_list_dir.md, kind: tool_description, tool: list_dir}
perturbations:
  ablation:
    - chunks: all
      modes: [remove, shuffle]
  chaos:
    - {fault: truncate_output, tool: run_tests, keep_chars: 200}
    - {fault: empty_result, tool: read_file}
    - {fault: malformed_json, tool: run_tests}
    - {fault: error_once, tool: write_file}
    - {fault: stale_file, tool: read_file}
    - {fault: renamed_path, tool: read_file}
budget:
  baseline_runs: 60
  min_runs_per_cell: 16
  max_runs_per_cell: 40
  alpha: 0.05
  correction: holm
  stop_rule: sequential
  meaningful_drop: 0.25
  max_total_calls: 8000
  max_usd: 15
  max_workers: 3
  max_minutes: 60
model:
  base_url: ${MODEL_BASE_URL}
  name: ${MODEL_NAME}
  temperature: 0.7
