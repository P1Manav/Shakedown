[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shakedown-agent-profiler"
version = "0.2.0"
description = "A sensitivity profiler for AI agents: reliability, context ablation, and chaos testing with honest statistics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Manav Prajapati" }]
urls = { Homepage = "https://github.com/P1Manav/Shakedown", Repository = "https://github.com/P1Manav/Shakedown", Issues = "https://github.com/P1Manav/Shakedown/issues" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scipy>=1.10", "statsmodels>=0.14", "ruff>=0.5"]

[project.scripts]
shakedown = "shakedown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shakedown*"]

[tool.setuptools.package-data]
shakedown = [
  "report/template.html.j2",
  "data/agent/prompt_chunks/*.md",
  "data/agent/prompt_chunks/manifest.yaml",
  "data/tasks/perturbations.yaml",
  "data/tasks/bugfix_*/task.yaml",
  "data/tasks/bugfix_*/repo/*.py",
  "data/tasks/bugfix_*/repo/*.md",
  "data/tasks/bugfix_*/repo/tests/*.py",
  "data/tasks/bugfix_*/solution/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_stats_oracle.py" = ["E402"]