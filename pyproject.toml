[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shakedown"
version = "0.1.0"
description = "A sensitivity profiler for AI agents: reliability, context ablation, and chaos testing with honest statistics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shakedown" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shakedown = "shakedown.cli:main"

[tool.setuptools.packages.find]
include = ["shakedown*"]

[tool.setuptools.package-data]
shakedown = ["report/*.j2", "demo_agent/prompt_chunks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"