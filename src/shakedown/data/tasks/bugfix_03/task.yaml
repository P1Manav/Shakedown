name: bugfix_03_cart
description: |
  add_item() in cart.py leaks state between calls: adding an item to a fresh
  cart returns items from earlier calls. Fix the function so each new cart is
  independent while an explicitly supplied cart is still mutated.
agent:
  command: 'python -m shakedown.demo_agent.agent --task {task_file} --workdir {workdir}'
  timeout_s: 240
  max_model_calls: 18
workspace:
  source: repo
  isolation: tempdir
success:
  command: 'python -m pytest -q tests/'
  timeout_s: 120
prompt_chunks:
  - {id: identity, file: data/agent/prompt_chunks/identity.md, kind: system}
  - {id: workflow, file: data/agent/prompt_chunks/workflow.md, kind: system}
  - {id: verification, file: data/agent/prompt_chunks/verification.md, kind: system}
  - {id: tool_read_file, file: data/agent/prompt_chunks/tool_read_file.md, kind: tool_description, tool: read_file}
  - {id: tool_write_file, file: data/agent/prompt_chunks/tool_write_file.md, kind: tool_description, tool: write_file}
  - {id: tool_run_tests, file: data/agent/prompt_chunks/tool_run_tests.md, kind: tool_description, tool: run_tests}
  - {id: tool_list_dir, file: data/agent/prompt_chunks/tool_list_dir.md, kind: tool_description, tool: list_dir}
budget:
  baseline_runs: 60
  min_runs_per_cell: 16
  max_runs_per_cell: 40
  alpha: 0.05
  correction: holm
  stop_rule: sequential
  meaningful_drop: 0.25
  max_total_calls: 8000
  max_usd: 15
  max_workers: 3
  max_minutes: 60
model:
  base_url: ${MODEL_BASE_URL}
  name: ${MODEL_NAME}
  temperature: 0.7
